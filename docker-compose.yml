x-app: &app
  build:
    context: .
    dockerfile: Dockerfile.dev
  volumes:
    - .:/app
    - bundle:/usr/local/bundle
  environment:
    DB_HOST: db
    DB_USER: postgres
    DB_PASSWORD: postgres
    REDIS_URL: redis://redis:6379/0
    TZ: America/Santiago
    BASIC_AUTH_USER: ${BASIC_AUTH_USER:-}
    BASIC_AUTH_PASSWORD: ${BASIC_AUTH_PASSWORD:-}
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_started

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      retries: 20

  redis:
    image: redis:7

  web:
    <<: *app
    ports:
      - "3000:3000"

  sidekiq:
    <<: *app
    command: bundle exec sidekiq -C config/sidekiq.yml

  # Túnel público opcional: docker compose --profile tunnel up -d
  # Requiere NGROK_AUTHTOKEN en .env (no versionado). URL pública en http://localhost:4040
  ngrok:
    image: ngrok/ngrok:3
    profiles: ["tunnel"]
    command: http web:3000
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-}
    ports:
      - "4040:4040"
    depends_on:
      - web

volumes:
  pgdata:
  bundle:
