x-app: &app
  build:
    context: .
    dockerfile: Dockerfile.dev
  volumes:
    - .:/app
    - bundle:/usr/local/bundle
  environment:
    DB_HOST: db
    DB_USER: postgres
    DB_PASSWORD: postgres
    TZ: America/Santiago
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      retries: 20

  web:
    <<: *app
    ports:
      - "3000:3000"

volumes:
  pgdata:
  bundle:
