default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("DB_HOST", "localhost") %>
  username: <%= ENV.fetch("DB_USER", "postgres") %>
  password: <%= ENV.fetch("DB_PASSWORD", "postgres") %>

development:
  <<: *default
  database: vacaciones_development

test:
  <<: *default
  database: vacaciones_test

production:
  <<: *default
  database: vacaciones_production
  url: <%= ENV["DATABASE_URL"] %>
