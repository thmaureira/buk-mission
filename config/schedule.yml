# Daily jobs (Chile time). All are idempotent: running twice never grants twice.
anniversary_grants:
  cron: "5 0 * * * America/Santiago"
  class: "AnniversaryGrantsJob"
  description: "R2/R3: carga 15 días legales + progresivas en el aniversario"
expirations:
  cron: "10 0 * * * America/Santiago"
  class: "ExpirationsJob"
  description: "R11: vence administrativos (31/12) y legales con más de dos períodos"
mark_taken:
  cron: "15 0 * * * America/Santiago"
  class: "MarkTakenJob"
  description: "R4: pasa a tomados los períodos cuya fecha de inicio ya llegó"
